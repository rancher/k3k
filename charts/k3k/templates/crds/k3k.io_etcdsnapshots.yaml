---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
    helm.sh/resource-policy: keep
  name: etcdsnapshots.k3k.io
spec:
  group: k3k.io
  names:
    kind: ETCDSnapshot
    listKind: ETCDSnapshotList
    plural: etcdsnapshots
    singular: etcdsnapshot
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.snapshotFileName
      name: Snapshot File
      type: string
    name: v1beta1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ETCDSnapshotSpec defines the desired state of a ETCDSnapshot.
            properties:
              clusterRef:
                description: ClusterRef is a reference to the cluster where the snapshot will be taken.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              compress:
                description: Specifies if the snapshot should be compressed
                type: boolean
              dir:
                description: |-
                  Dir defines the location where the snapshot will be created, if
                  left empty k3k will use the directory configured for k3s when the
                  cluster was created
                type: string
              s3ConfigSecretRef:
                description: |-
                  S3ConfigSecret defines the S3 configuration secret that contains all
                  s3 configuration, the configuration items are expected to match the following
                  https://docs.k3s.io/cli/etcd-snapshot?_highlight=snapshot#s3-compatible-object-store-support
                properties:
                  name:
                    description: name is unique within a namespace to reference a secret resource.
                    type: string
                  namespace:
                    description: namespace defines the space within which the secret name must be unique.
                    type: string
                type: object
                x-kubernetes-map-type: atomic
            required:
            - clusterRef
            type: object
          status:
            default: {}
            description: ETCDSnapshotStatus reflects the observed state of a ETCDSnapshot.
            properties:
              snapshotFileName:
                description: |-
                  SnapshotFileName is the name of the ETCDSnapshotFile object in the virtual
                  cluster that backs this snapshot.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
