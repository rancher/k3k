name: Validate

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rancher/ci-image/go1.27:1.27.4
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Run linters
      run: golangci-lint run -v

    - name: Run formatters
      run: golangci-lint -v fmt --diff ./...

  # Runs on the runner: yamllint and shellcheck aren't in the ci-image,
  # and `make docs` bind-mounts the workspace into a pandoc container.
  validate:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version-file: go.mod
        cache: true

    - name: Lint YAML
      run: |
        pipx install yamllint==1.38.0
        make lint-yaml

    - name: Lint shell scripts
      run: make lint-shell

    - name: Validate
      run: make validate
