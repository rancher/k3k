name: Chart

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chart-release:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rancher/ci-image/go1.27:1.27.4
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0

    - name: Configure Git
      run: |
        git config user.name "$GITHUB_ACTOR"
        git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

    - name: Run chart-releaser
      uses: helm/chart-releaser-action@92c6b97fa9f664492a2592e0d1d80bc6bf378957 # v1.9.0
      with:
        config: .cr.yaml
      env:
        CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
